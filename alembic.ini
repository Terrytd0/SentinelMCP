# Alembic configuration for SentinelMCP.
#
# The database URL is deliberately NOT set here. `alembic/env.py` reads it
# from `backend.config.settings` so there is exactly one place a DSN is
# configured, and a value in this file could silently disagree with the
# application's. `sqlalchemy.url` is therefore left blank and filled at runtime.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped, descriptive filenames rather than Alembic's random 12-char
# hex. A migration you can name is a migration you can find.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Migrations are type- and default-aware; both comparisons are on in env.py
# too. This section is the legacy location and is kept consistent with it.
# truncate_strings = False

[post_write_hooks]
# No autoformat hook. A migration that ruff reformats after Alembic has
# generated it can obscure what autogenerate actually decided, and the
# generated code is reviewed as the *tool's* output, not as hand-written code.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
