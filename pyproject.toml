[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelmcp"
version = "0.1.0"
description = "Security-triage MCP server with an AutoGen developer/reviewer loop that drafts human-approved remediation pull requests."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Terry Nyirenda" },
]

dependencies = [
    # --- Web framework (dashboard + triage API) ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # --- Model Context Protocol server surface ---
    # Both SDK majors supported: v1 exposes `FastMCP`, v2 renamed it to
    # `MCPServer`, and the API this project uses is unchanged. Unpinned on
    # purpose so it coexists with whatever a reviewer already has -- notably
    # `semgrep`, which pins mcp<2. See docs/adr/004-mcp-sdk-major-version.md.
    "mcp>=1.2.0",

    # --- Multi-agent developer/reviewer loop ---
    # Split into the published distributions rather than the legacy `autogen`
    # meta-package, because the meta-package also drags in the `autogen_ext`
    # execution layer (code executors, docker runtimes) this project has no
    # use for -- see docs/adr/002-autogen-vs-langgraph-crewai.md.
    #   autogen-core      messages, Component, the ModelClient protocol
    #   autogen-agentchat AssistantAgent, teams, termination conditions
    #   autogen-ext       the concrete OpenAI model client
    "autogen-core>=0.4.0",
    "autogen-agentchat>=0.4.0",
    "autogen-ext[openai]>=0.4.0",
    "openai>=1.50.0",

    # --- Typed service boundary (scanning service) ---
    "grpcio>=1.68.0",
    "grpcio-status>=1.68.0",
    "protobuf>=5.28.0",

    # --- Data / settings ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",

    # --- Database (system of record for findings, tickets, audit) ---
    "sqlalchemy>=2.0.0",
    # SQLAlchemy's asyncio layer needs greenlet for the asyncpg driver. The
    # `[asyncio]` extra exists to pull exactly this, and without it every
    # `create_async_engine` fails at construction with an ImportError that
    # mentions neither SQLAlchemy nor the driver in the useful part.
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",

    # --- Auth ---
    "pyjwt>=2.9.0",
    "pwdlib[argon2]>=0.2.1",
    "argon2-cffi>=23.1.0",

    # --- HTTP client (telemetry HTTP sink, Semgrep probe) ---
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    # Floors are not arbitrary. `ruff` 0.16 is where `ruff format` started
    # formatting Python code blocks inside Markdown, so the docs' code samples
    # are formatted rather than hand-aligned; below that, `make check` and CI
    # would disagree about the same file. Keep in step with the pins in
    # `.github/workflows/ci.yml` and `.pre-commit-config.yaml`.
    "ruff>=0.16.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    # grpcio-tools generates the `*_pb2.py` / `*_pb2_grpc.py` modules from
    # proto/sentinel/v1/scanner.proto. The generated output is committed
    # (backend/grpc_service/generated/), so this is a *regeneration* tool
    # rather than a runtime dependency -- see that directory's README.
    "grpcio-tools>=1.68.0",
    # Protobuf/grpcio emit bare "Exception" subclasses in generated code.
    "types-protobuf>=4.24.0",
]

[project.scripts]
# Console entrypoints mirroring backend/scripts/*.py. The scripts remain
# runnable as `python -m backend.scripts.<name>`; these are the ergonomic
# aliases for an installed package.
sentinel-scan = "backend.scripts.run_grpc_server:main"
sentinel-mcp = "backend.scripts.run_mcp_server:main"
sentinel-remediate = "backend.scripts.run_remediation:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exercises a real external dependency -- a live PostgreSQL, or a real gRPC socket on an ephemeral port (see tests/integration/README.md). Skips itself if the database is unreachable rather than failing a plain `pytest` run.",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Generated code is not hand-maintained -- never lint or format it. Both
# trees are regenerable from a schema, and reformatting generated output
# obscures what the generator actually decided.
extend-exclude = [
    "backend/grpc_service/generated",
    "alembic/versions",
    # Deliberately vulnerable sample code: scanned as a target, never imported.
    "data/samples",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's `Depends(...)`/`Query(...)`/... in argument defaults is the idiomatic pattern, not a mutable-default bug.
    "UP042", # `class X(str, enum.Enum)` is kept intentionally (see backend/database/enums.py) over `enum.StrEnum`: SQLAlchemy's Enum type stores the *value*, and StrEnum members are str subclasses, which makes the stored/loaded type ambiguous.
]

[tool.ruff.lint.per-file-ignores]
# Tests build fakes and assert on loosely-typed payloads; the strict
# unused-argument / private-member rules that make sense in backend/ just
# produce noise here.
"tests/**" = ["B011", "F401"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = true
# `backend/grpc_service/generated` is machine-written; type-checking it
# produces errors we cannot fix without hand-editing generated code.
# `data/samples` is deliberately vulnerable sample code, scanned as a target
# and never imported, so it is outside every quality gate.
exclude = [
    "backend/grpc_service/generated/",
    "data/samples/",
]
# tests/ has no __init__.py files (pytest doesn't need them) and has several
# same-named test modules in different subdirectories; without this, mypy
# treats them as one top-level module and errors.
explicit_package_bases = true

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.sdist]
include = ["backend", "proto", "alembic", "docs", "tests", "README.md"]
